name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tests open real (off-screen) WPF windows, which the hosted Windows runners support.
      - name: Build
        run: dotnet build tests/StickyNotes.Tests/StickyNotes.Tests.csproj --configuration Release

      - name: Test
        run: >
          dotnet test tests/StickyNotes.Tests/StickyNotes.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
